<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Devotionals by Henry Pan.">
  <title>devotionals — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    .devotionals { list-style: none; }
    .devotionals li { margin: 0 0 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid var(--rule); }
    .devotionals li:last-child { border-bottom: 0; }
    .devo-date { display: block; color: var(--mut); font-size: 0.8rem; letter-spacing: 0.03em; margin-bottom: 0.4rem; }
    .devo-title { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.35rem; }
    .devo-passage { display: inline-block; margin-bottom: 0.8rem; color: var(--mut); font-size: 0.9rem; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
    .devo-passage:hover { color: var(--ink); text-decoration-color: var(--ink); }
    .devo-body { line-height: 1.6; }
    .devo-body p { margin: 0 0 0.8em; }
    .devo-body p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Devotionals</h1>
    <ul class="devotionals" id="devotionals"></ul>
  </main>
  <script>
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(iso) {
      var p = String(iso).split('-');
      if (p.length !== 3) return iso;
      return MONTHS[(+p[1]) - 1] + ' ' + (+p[2]) + ', ' + p[0];
    }
    function bibleGatewayUrl(passage, version) {
      return 'https://www.biblegateway.com/passage/?search=' +
        encodeURIComponent(passage) + '&version=' + encodeURIComponent(version || 'ESV');
    }
    fetch('/assets/data/devotionals.json').then(function (r) { return r.json(); }).then(function (items) {
      items.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
      var ul = document.getElementById('devotionals');
      items.forEach(function (d) {
        var li = document.createElement('li');

        var date = document.createElement('span');
        date.className = 'devo-date';
        date.textContent = fmtDate(d.date);
        li.appendChild(date);

        if (d.title) {
          var h = document.createElement('h2');
          h.className = 'devo-title';
          h.textContent = d.title;
          li.appendChild(h);
        }

        if (d.passage) {
          var a = document.createElement('a');
          a.className = 'devo-passage';
          a.href = bibleGatewayUrl(d.passage, d.version);
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = d.passage;
          li.appendChild(a);
        }

        var body = document.createElement('div');
        body.className = 'devo-body';
        String(d.body).split(/\n\n+/).forEach(function (para) {
          var p = document.createElement('p');
          p.textContent = para;
          body.appendChild(p);
        });
        li.appendChild(body);

        ul.appendChild(li);
      });
    }).catch(function () {});
  </script>
</body>
</html>
