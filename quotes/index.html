<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quotes Henry Pan keeps coming back to.">
  <title>quotes — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    .quotes { list-style: none; }
    .quotes li { margin: 0 0 2rem; }
    .quotes blockquote { font-size: 1.1rem; line-height: 1.55; }
    .quotes cite { display: block; margin-top: 0.5rem; font-style: normal; font-size: 0.9rem; color: var(--mut); }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Quotes</h1>
    <ul class="quotes" id="quotes"></ul>
  </main>
  <script>
    fetch('/assets/data/quotes.json').then(function (r) { return r.json(); }).then(function (items) {
      var ul = document.getElementById('quotes');
      items.forEach(function (q) {
        var li = document.createElement('li');
        var bq = document.createElement('blockquote');
        bq.appendChild(document.createTextNode('“' + q.text + '”'));
        if (q.author) {
          var c = document.createElement('cite');
          c.textContent = '— ' + q.author;
          bq.appendChild(c);
        }
        li.appendChild(bq);
        ul.appendChild(li);
      });
    }).catch(function () {});
  </script>
</body>
</html>
