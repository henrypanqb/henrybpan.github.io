<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Subscribe to Henry Pan's newsletter — occasional essays on faith, focus, and creative work.">
  <title>newsletter — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    .signup-form { max-width: 520px; margin: 1.5rem 0 2.75rem; }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mut);
      margin-bottom: 0.45rem;
    }
    .field input {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 0.6rem 0.7rem;
      transition: border-color 0.15s ease;
    }
    .field input:focus {
      outline: none;
      border-color: var(--ink);
    }
    .signup-form button {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 500;
      color: var(--paper);
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .signup-form button:hover:not(:disabled) { opacity: 0.85; }
    .signup-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 0.9rem; font-size: 0.92rem; color: var(--mut); min-height: 1.2em; }
    .status.ok { color: #3f6f4a; }
    .status.err { color: #a8443a; }
    .fine {
      margin-top: 2.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
      font-size: 0.82rem;
      color: var(--mut);
      line-height: 1.6;
    }
    .fine a { color: var(--mut); text-decoration: underline; text-underline-offset: 2px; }
    .fine a:hover { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Newsletter</h1>
    <div class="prose">
      <p>Notes from my life. Sharing my recommendations and other anecdotes.</p>
    </div>

    <form class="signup-form" id="signup-form" action="https://formspree.io/f/xaqgyvae" method="POST">
      <div class="field">
        <label for="email">Your email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" id="submit-btn">Subscribe</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <div class="fine">
      <p>No third-party tracking. Unsubscribe anytime by replying "unsubscribe" to any email, or by <a href="mailto:henry@henrybpan.com?subject=Unsubscribe&body=Please remove me from your newsletter list.">emailing me directly</a>.</p>
    </div>
  </main>

  <script>
    (function () {
      var form   = document.getElementById('signup-form');
      var status = document.getElementById('status');
      var btn    = document.getElementById('submit-btn');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        var email = form.querySelector('input[type="email"]').value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          status.className = 'status err';
          status.textContent = 'Please enter a valid email address.';
          return;
        }

        btn.disabled = true;
        status.className = 'status';
        status.textContent = 'Subscribing…';

        try {
          var res = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { Accept: 'application/json' }
          });
          if (res.ok) {
            form.reset();
            btn.disabled = false;
            status.className = 'status ok';
            status.textContent = 'You\'re on the list. Talk soon.';
          } else {
            var data = await res.json().catch(function () { return {}; });
            btn.disabled = false;
            status.className = 'status err';
            status.textContent = (data && data.error) || 'Something went wrong. Try again.';
          }
        } catch (err) {
          btn.disabled = false;
          status.className = 'status err';
          status.textContent = 'Network error. Check your connection and try again.';
        }
      });
    }());
  </script>
</body>
</html>
