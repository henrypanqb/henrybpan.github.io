<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Short thoughts from Henry Pan.">
  <title>thoughts — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    .thoughts { list-style: none; }
    .thoughts li { margin: 0 0 1.6rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--rule); }
    .thoughts li:last-child { border-bottom: 0; }
    .thought-body { font-size: 1.08rem; line-height: 1.55; }
    .thought-body p { margin: 0 0 0.7em; }
    .thought-body p:last-child { margin-bottom: 0; }
    .thought-date { display: block; color: var(--mut); font-size: 0.8rem; letter-spacing: 0.03em; margin-top: 0.6rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Thoughts</h1>
    <ul class="thoughts" id="thoughts"></ul>
  </main>
  <script>
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(iso) {
      var p = String(iso).split('T')[0].split('-');
      if (p.length !== 3) return iso;
      return MONTHS[(+p[1]) - 1] + ' ' + (+p[2]) + ', ' + p[0];
    }
    fetch('/assets/data/thoughts.json').then(function (r) { return r.json(); }).then(function (items) {
      items.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
      var ul = document.getElementById('thoughts');
      items.forEach(function (t) {
        var li = document.createElement('li');
        var body = document.createElement('div');
        body.className = 'thought-body';
        String(t.body).split(/\n\n+/).forEach(function (para) {
          var p = document.createElement('p');
          p.textContent = para;
          body.appendChild(p);
        });
        li.appendChild(body);
        var d = document.createElement('span');
        d.className = 'thought-date';
        d.textContent = fmtDate(t.date);
        li.appendChild(d);
        ul.appendChild(li);
      });
    }).catch(function () {});
  </script>
</body>
</html>
