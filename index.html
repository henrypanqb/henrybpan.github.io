  <style>
    /* ==========================================================
       LINK PAGE — mobile-first, centered single column.
       No cards, no bubbles: links are plain text on their own
       lines, separated by whitespace only.
    ========================================================== */
    body { text-align: center; }

    main.linkpage {
      max-width: 30rem;
      margin: 0 auto;
      padding: clamp(2.5rem, 8vh, 4rem) 1.5rem clamp(3rem, 10vh, 4.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---- Name ---- */
    .name {
      font-size: clamp(1.6rem, 7vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.2;
      margin: 0;
    }

    /* ---- Social icon row ---- */
    .socials {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 1.35rem;
      margin: 0.95rem 0 0;
      padding: 0;
    }
    .socials a {
      display: block;
      color: var(--mut);
      padding: 0.35rem;
      margin: -0.35rem;           /* keeps the 44px tap target without spacing drift */
      transition: color 0.15s ease, transform 0.15s ease;
    }
    .socials a:hover,
    .socials a:focus-visible { color: var(--ink); transform: translateY(-1px); }
    .socials svg { width: 19px; height: 19px; display: block; fill: currentColor; }

    /* ---- Latest video ---- */
    .video {
      display: block;
      width: 100%;
      margin: clamp(2rem, 6vh, 2.75rem) 0 0;
      color: var(--ink);
      text-decoration: none;
    }
    .video-kicker {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mut);
      margin-bottom: 0.85rem;
    }
    .video-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #d9d4c6;
    }
    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.25s ease;
    }
    .video-thumb img.is-loaded { opacity: 1; }
    .video:hover .video-thumb img { transform: scale(1.02); }

    /* Play glyph — a hairline circle, no filled YouTube chrome */
    .video-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .video-play span {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.9);
      background: rgba(28,28,28,0.28);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: grid;
      place-items: center;
    }
    .video-play svg { width: 15px; height: 15px; fill: #fff; margin-left: 2px; }

    .video-title {
      display: block;
      margin-top: 0.8rem;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ink);
      max-width: 26rem;
      margin-left: auto;
      margin-right: auto;
    }
    .video:hover .video-title { text-decoration: underline; text-underline-offset: 3px; }

    /* ---- Link stack: line breaks only, no boxes ---- */
    .links {
      list-style: none;
      margin: clamp(1.6rem, 4.5vh, 2.25rem) 0 0;
      padding: 0;
      width: 100%;
    }
    .links li { margin: 0; }
    .links a {
      display: block;
      padding: 0.6rem 0;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.075rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: color 0.15s ease, opacity 0.15s ease;
    }
    .links a:hover,
    .links a:focus-visible { color: var(--mut); }

    /* ---- Discord CTA ---- */
    .discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: clamp(2rem, 5.5vh, 2.75rem) auto 0;
      padding: 0.7rem 1.4rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .discord svg { width: 18px; height: 18px; fill: currentColor; display: block; }
    .discord:hover,
    .discord:focus-visible { background: var(--ink); color: var(--paper); }

    /* ---- Desktop / large screens ---- */
    @media (min-width: 760px) {
      main.linkpage { max-width: 34rem; padding-top: clamp(4rem, 12vh, 6rem); }
      .name { font-size: 2.25rem; }
      .socials { gap: 1.5rem; }
      .socials svg { width: 20px; height: 20px; }
      .links a { font-size: 1.15rem; padding: 0.65rem 0; }
      .video-title { font-size: 1rem; }
      .discord { font-size: 1.02rem; padding: 0.75rem 1.6rem; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  <script>
    // ---- Latest YouTube video: thumbnail, title, and app deep link ----
    (function () {
      var link  = document.getElementById('latest-video');
      var img   = document.getElementById('latest-video-thumb');
      var title = document.getElementById('latest-video-title');
      if (!link) return;

      var ua        = navigator.userAgent || '';
      var isIOS     = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);

      function setThumb(id) {
        img.onerror = function () {
          img.onerror = null;
          img.src = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
        };
        img.onload = function () { img.classList.add('is-loaded'); };
        img.src = 'https://img.youtube.com/vi/' + id + '/maxresdefault.jpg';
      }

      // On phones, hand the tap to the YouTube app; fall back to the web URL
      // if the app isn't installed (or the scheme is blocked).
      function wireDeepLink(id) {
        var web = 'https://www.youtube.com/watch?v=' + id;
        link.href = web;
        if (!isIOS && !isAndroid) return;
        link.addEventListener('click', function (e) {
          if (isAndroid) {
            e.preventDefault();
            window.location.href =
              'intent://www.youtube.com/watch?v=' + id +
              '#Intent;package=com.google.android.youtube;scheme=https;' +
              'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
          } else {
            e.preventDefault();
            var fallback = setTimeout(function () { window.location.href = web; }, 1200);
            var cancel = function () { clearTimeout(fallback); };
            window.addEventListener('pagehide', cancel, { once: true });
            document.addEventListener('visibilitychange', function () {
              if (document.hidden) cancel();
            }, { once: true });
            window.location.href = 'youtube://www.youtube.com/watch?v=' + id;
          }
        });
      }

      fetch('/assets/data/dates.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('dates.json ' + r.status); return r.json(); })
        .then(function (data) {
          var v = data && data.latestVideo;
          if (!v || !v.id) throw new Error('no latest video');
          setThumb(v.id);
          img.alt = v.title || 'Latest video';
          title.textContent = v.title || '';
          wireDeepLink(v.id);
        })
        .catch(function () {
          // No data: keep the channel link, drop the empty thumbnail frame.
          var frame = link.querySelector('.video-thumb');
          if (frame) frame.remove();
          title.textContent = '';
        });
    }());
  </script>
