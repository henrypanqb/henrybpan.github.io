<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Henry Pan — writing, reading, and recommendations.">
  <meta property="og:title" content="Henry Pan">
  <meta property="og:description" content="Writing, reading, and recommendations.">
  <meta property="og:image" content="https://henrybpan.com/preview.png?v=4">
  <meta property="og:url" content="https://henrybpan.com/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://henrybpan.com/">
  <title>Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    /* Centered column, left-aligned text (sonith.org style) */
    main.home {
      margin: 0 auto;
      max-width: 640px;
      text-align: left;
      padding-top: clamp(3.5rem, 10vh, 6rem);
      padding-left: clamp(1.25rem, 5vw, 2rem);
      padding-right: clamp(1.25rem, 5vw, 2rem);
    }

    .hero-tagline {
      color: var(--ink);
      font-size: clamp(0.98rem, 1.58vw, 1.13rem);
      line-height: 1.5;
      max-width: 30rem;
      margin: 0.9rem 0 1.8rem;
    }

    /* Two stacked rows of links, no hamburger */
    .linkrow { display: flex; flex-wrap: wrap; list-style: none; }
    .linkrow a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    .linkrow a:hover { border-color: var(--ink); }
    .linkrow.primary { gap: 1.2rem; }
    .linkrow.primary a { font-size: clamp(1.05rem, 1.6vw, 1.2rem); }
    .linkrow.secondary { gap: 0.95rem; margin-top: 0.7rem; }
    .linkrow.secondary a { font-size: clamp(0.95rem, 1.4vw, 1.05rem); color: var(--mut); }
    .linkrow.secondary a:hover { color: var(--ink); border-color: var(--ink); }

    .newsletter-block {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      max-width: 480px;
    }
    .newsletter-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mut);
      margin-bottom: 0.35rem;
    }
    .newsletter-blurb {
      font-size: clamp(0.9rem, 1.3vw, 0.98rem);
      color: var(--mut);
      margin-bottom: 0.85rem;
    }
    .newsletter-blurb a {
      color: var(--mut);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .newsletter-blurb a:hover { color: var(--ink); }
    .newsletter-form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .newsletter-form input[type="email"] {
      flex: 1 1 200px;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 0.5rem 0.65rem;
      transition: border-color 0.15s ease;
      min-width: 0;
    }
    .newsletter-form input[type="email"]:focus { outline: none; border-color: var(--ink); }
    .newsletter-form button {
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--paper);
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.5rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }
    .newsletter-form button:hover:not(:disabled) { opacity: 0.85; }
    .newsletter-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .newsletter-status { margin-top: 0.55rem; font-size: 0.85rem; color: var(--mut); min-height: 1.1em; }
    .newsletter-status.ok { color: #3f6f4a; }
    .newsletter-status.err { color: #a8443a; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap home">
    <h1 class="title">Henry Pan</h1>
    <p class="hero-tagline">work at everything with all your heart, as working for the Lord and not human masters.</p>

    <ul class="linkrow primary">
      <li><a href="https://www.instagram.com/henrybpan" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a id="yt-link" href="https://www.youtube.com/@henrybpan" target="_blank" rel="noopener noreferrer">YouTube</a></li>
      <li><a href="/writings/">Essays</a></li>
    </ul>
    <ul class="linkrow secondary">
      <li><a href="/about/">About</a></li>
      <li><a href="/now/">Now</a></li>
      <li><a href="/library/">Library</a></li>
      <li><a href="/quotes/">Quotes</a></li>
      <li><a href="/devotionals/">Devotionals</a></li>
      <li><a href="/thoughts/">Thoughts</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>

    <div class="newsletter-block">
      <p class="newsletter-label">Newsletter</p>
      <p class="newsletter-blurb">Notes from my life. <a href="/newsletter/">More info →</a></p>
      <form class="newsletter-form" id="home-signup" action="https://formspree.io/f/xaqgyvae" method="POST">
        <input type="email" name="email" placeholder="your@email.com" required autocomplete="email" aria-label="Email address">
        <button type="submit">Subscribe</button>
      </form>
      <p class="newsletter-status" id="home-status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script>
    (function () {
      var form   = document.getElementById('home-signup');
      var status = document.getElementById('home-status');
      var btn    = form.querySelector('button');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = form.querySelector('input[type="email"]').value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          status.className = 'newsletter-status err';
          status.textContent = 'Please enter a valid email address.';
          return;
        }
        btn.disabled = true;
        status.className = 'newsletter-status';
        status.textContent = 'Subscribing…';
        try {
          var res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
          if (res.ok) {
            form.reset();
            btn.disabled = false;
            status.className = 'newsletter-status ok';
            status.textContent = 'You\'re on the list. Talk soon.';
          } else {
            var data = await res.json().catch(function () { return {}; });
            btn.disabled = false;
            status.className = 'newsletter-status err';
            status.textContent = (data && data.error) || 'Something went wrong. Try again.';
          }
        } catch (err) {
          btn.disabled = false;
          status.className = 'newsletter-status err';
          status.textContent = 'Network error. Try again.';
        }
      });
    }());
  </script>

  <script>
    // In Instagram/Facebook in-app browsers, a normal youtube.com link opens
    // inside their webview instead of the YouTube app. Best-effort: when we
    // detect an in-app browser, try the native app via deep link, falling back
    // to the regular link. Desktop and normal mobile browsers are untouched.
    (function () {
      var link = document.getElementById('yt-link');
      if (!link) return;
      var ua = navigator.userAgent || '';
      var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|Twitter|TikTok|musical_ly/i.test(ua);
      if (!inApp) return; // universal links already open the app in normal browsers
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var CHANNEL = 'UCjUMsx6Vqgy9x0MWWzQ7FlA';
      var web = link.href; // https://www.youtube.com/@henrybpan
      link.addEventListener('click', function (e) {
        if (isAndroid) {
          e.preventDefault();
          window.location.href =
            'intent://www.youtube.com/channel/' + CHANNEL +
            '#Intent;package=com.google.android.youtube;scheme=https;' +
            'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
        } else if (isIOS) {
          e.preventDefault();
          var fallback = setTimeout(function () { window.location.href = web; }, 1200);
          var cancel = function () { clearTimeout(fallback); };
          window.addEventListener('pagehide', cancel, { once: true });
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) cancel();
          }, { once: true });
          window.location.href = 'youtube://www.youtube.com/channel/' + CHANNEL;
        }
      });
    }());
  </script>
</body>
</html>
