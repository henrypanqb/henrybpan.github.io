<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Henry Pan — writing, reading, and recommendations.">
  <meta property="og:title" content="Henry Pan">
  <meta property="og:description" content="Writing, reading, and recommendations.">
  <meta property="og:image" content="https://henrybpan.com/preview.png?v=4">
  <meta property="og:url" content="https://henrybpan.com/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://henrybpan.com/">
  <title>Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    /* Homepage: more top room so the fixed menu button clears the hero */
    main.home { padding-top: clamp(4.5rem, 13vh, 7.5rem); }

    .hero-tagline {
      color: var(--ink);
      font-size: clamp(1.05rem, 1.7vw, 1.22rem);
      line-height: 1.5;
      max-width: 30rem;
      margin: 0.9rem 0 1.7rem;
    }

    /* CTAs on one horizontal line */
    .hero-cta { display: flex; flex-wrap: wrap; gap: 1.4rem; list-style: none; }
    .hero-cta a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      font-size: clamp(1.05rem, 1.6vw, 1.2rem);
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    .hero-cta a:hover { border-color: var(--ink); }

    /* Hamburger toggle — fixed, aligned to the column's left edge */
    .menu-toggle {
      position: fixed;
      top: clamp(1.1rem, 3vw, 1.7rem);
      left: clamp(1.5rem, 6vw, 4rem);
      z-index: 60;
      background: none;
      border: 0;
      padding: 0.35rem;
      margin: -0.35rem;
      cursor: pointer;
      color: var(--ink);
      line-height: 0;
    }
    .menu-toggle svg { display: block; width: 22px; height: 22px; }
    .menu-toggle .icon-close { display: none; }
    .menu-toggle.is-open .icon-open { display: none; }
    .menu-toggle.is-open .icon-close { display: block; }

    /* Full-screen overlay menu */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--paper);
      padding: clamp(5rem, 14vh, 8rem) clamp(1.5rem, 6vw, 4rem);
    }
    .overlay[hidden] { display: none; }
    .overlay ul { list-style: none; }
    .overlay li { margin: 0.35rem 0; }
    .overlay a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: -0.01em;
    }
    .overlay a:hover { color: var(--mut); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
    <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
  </button>

  <nav class="overlay" id="menu" aria-label="Site menu" hidden>
    <ul>
      <li><a href="/about/">About</a></li>
      <li><a href="/now/">Now</a></li>
      <li><a href="/library/">Library</a></li>
      <li><a href="/quotes/">Quotes</a></li>
      <li><a href="/devotionals/">Devotionals</a></li>
      <li><a href="/thoughts/">Thoughts</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
  </nav>

  <main class="wrap home">
    <h1 class="title">Henry Pan</h1>
    <p class="hero-tagline">work at everything with all your heart, as working for the Lord and not human masters.</p>
    <ul class="hero-cta">
      <li><a href="https://www.instagram.com/henrybpan" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a id="yt-link" href="https://www.youtube.com/@henrybpan" target="_blank" rel="noopener noreferrer">YouTube</a></li>
      <li><a href="/writings/">Essays</a></li>
    </ul>
  </main>

  <script>
    // Full-screen overlay menu toggle.
    (function () {
      var btn = document.getElementById('menuToggle');
      var menu = document.getElementById('menu');
      if (!btn || !menu) return;
      function open() { menu.hidden = false; btn.classList.add('is-open'); btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-label', 'Close menu'); }
      function close() { menu.hidden = true; btn.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-label', 'Open menu'); }
      btn.addEventListener('click', function () { if (menu.hidden) open(); else close(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !menu.hidden) { close(); btn.focus(); }
      });
    }());

    // In Instagram/Facebook in-app browsers, a normal youtube.com link opens
    // inside their webview instead of the YouTube app. Best-effort: when we
    // detect an in-app browser, try the native app via deep link, falling back
    // to the regular link. Desktop and normal mobile browsers are untouched.
    (function () {
      var link = document.getElementById('yt-link');
      if (!link) return;
      var ua = navigator.userAgent || '';
      var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|Twitter|TikTok|musical_ly/i.test(ua);
      if (!inApp) return; // universal links already open the app in normal browsers
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var CHANNEL = 'UCjUMsx6Vqgy9x0MWWzQ7FlA';
      var web = link.href; // https://www.youtube.com/@henrybpan
      link.addEventListener('click', function (e) {
        if (isAndroid) {
          e.preventDefault();
          window.location.href =
            'intent://www.youtube.com/channel/' + CHANNEL +
            '#Intent;package=com.google.android.youtube;scheme=https;' +
            'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
        } else if (isIOS) {
          e.preventDefault();
          var fallback = setTimeout(function () { window.location.href = web; }, 1200);
          var cancel = function () { clearTimeout(fallback); };
          window.addEventListener('pagehide', cancel, { once: true });
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) cancel();
          }, { once: true });
          window.location.href = 'youtube://www.youtube.com/channel/' + CHANNEL;
        }
      });
    }());
  </script>
</body>
</html>
