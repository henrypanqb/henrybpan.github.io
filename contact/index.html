<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Henry Pan.">
  <title>contact — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    .contact-form { max-width: 520px; margin: 0.5rem 0 2.75rem; }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mut);
      margin-bottom: 0.45rem;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 0;
      padding: 0.6rem 0.7rem;
      transition: border-color 0.15s ease;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--ink);
    }
    .field textarea { resize: vertical; min-height: 7rem; }
    .contact-form button {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 500;
      color: var(--paper);
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .contact-form button:hover { opacity: 0.85; }
    .status { margin-top: 0.9rem; font-size: 0.92rem; color: var(--mut); min-height: 1.2em; }
    .status.ok { color: #3f6f4a; }
    .status.err { color: #a8443a; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Contact</h1>
    <div class="prose">
      <p>Collaborations, partnerships, speaking, or just saying hi — send me a note.</p>
    </div>

    <form class="contact-form" id="contact-form" action="https://formspree.io/f/xqewvkjk" method="POST">
      <div class="field"><label for="name">Your name</label><input type="text" id="name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="email">Your email</label><input type="email" id="email" name="email" required autocomplete="email"></div>
      <div class="field">
        <label for="subject">What's this about?</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Choose one</option>
          <option value="general">General inquiry</option>
          <option value="collaboration">Collaboration</option>
          <option value="partnership">Brand partnership</option>
          <option value="speaking">Speaking / podcast</option>
          <option value="other">Something else</option>
        </select>
      </div>
      <div class="field"><label for="message">Your message</label><textarea id="message" name="message" required rows="5"></textarea></div>
      <button type="submit">Send message</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <section class="section">
      <p class="section-label">Or reach me elsewhere</p>
      <ul class="list">
        <li><a href="mailto:work@henrybpan.com"><span class="row-title">Email</span><span class="row-meta">work@henrybpan.com</span></a></li>
        <li><a href="https://www.instagram.com/henrybpan" target="_blank" rel="noopener noreferrer"><span class="row-title">Instagram</span><span class="row-meta">@henrybpan</span></a></li>
        <li><a href="https://www.youtube.com/@henrybpan" target="_blank" rel="noopener noreferrer"><span class="row-title">YouTube</span><span class="row-meta">@henrybpan</span></a></li>
        <li><a href="https://www.tiktok.com/@henrybpan" target="_blank" rel="noopener noreferrer"><span class="row-title">TikTok</span><span class="row-meta">@henrybpan</span></a></li>
        <li><a href="https://x.com/henrypanonx" target="_blank" rel="noopener noreferrer"><span class="row-title">X</span><span class="row-meta">@henrypanonx</span></a></li>
        <li><a href="https://www.linkedin.com/in/henrybpan/" target="_blank" rel="noopener noreferrer"><span class="row-title">LinkedIn</span><span class="row-meta">in/henrybpan</span></a></li>
      </ul>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var status = document.getElementById('status');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        status.className = 'status'; status.textContent = 'Sending…';
        try {
          var res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
          if (res.ok) { form.reset(); status.className = 'status ok'; status.textContent = 'Sent. I’ll get back to you soon.'; }
          else { var data = await res.json().catch(function () { return {}; }); status.className = 'status err'; status.textContent = (data && data.error) || 'Something went wrong. Try emailing me directly.'; }
        } catch (err) { status.className = 'status err'; status.textContent = 'Network error. Try emailing me directly.'; }
      });
    }());
  </script>
</body>
</html>
