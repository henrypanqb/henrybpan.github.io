<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Henry Pan's library — the best things he's read and watched, plus a running log.">
  <title>library — Henry Pan</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/assets/minimal.css?v=1">
  <style>
    /* ---- Library controls (filter chips + sort) ---- */
    .lib-controls {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 1rem 1.5rem;
      margin-bottom: 2.5rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip {
      font-family: var(--font); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.04em; color: var(--mut);
      background: transparent; border: 1px solid var(--rule);
      border-radius: 999px; padding: 0.28rem 0.72rem; cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .chip:hover { color: var(--ink); border-color: var(--ink); }
    .chip.is-active { color: var(--paper); background: var(--ink); border-color: var(--ink); }
    .chip-lindy { color: #b06a43; border-color: rgba(201,137,104,0.6); }
    .chip-lindy:hover { color: #fff; background: #c98968; border-color: #c98968; }
    .chip-lindy.is-active { color: #fff; background: #c98968; border-color: #c98968; }
    .sort {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--mut);
    }
    .sort select {
      font-family: var(--font); font-size: 0.85rem; font-weight: 500;
      color: var(--ink); background: transparent;
      border: 1px solid var(--rule); border-radius: 6px; padding: 0.32rem 0.5rem;
      cursor: pointer;
    }
    .sort select:focus { outline: none; border-color: var(--ink); }

    /* ---- Section counts ---- */
    .count { color: var(--mut); font-weight: 500; letter-spacing: 0.04em; margin-left: 0.35rem; }

    /* ---- A splash of color on the status chips ---- */
    .tag.s-reading  { color: #2f6b43; border-color: rgba(47,107,67,0.45);  background: rgba(47,107,67,0.10); }
    .tag.s-to-read  { color: #8a5a14; border-color: rgba(138,90,20,0.42);  background: rgba(138,90,20,0.10); }
    .tag.s-read     { color: #345f7d; border-color: rgba(52,95,125,0.42);  background: rgba(52,95,125,0.10); }
    .tag.s-to-watch { color: #8a5a14; border-color: rgba(138,90,20,0.42);  background: rgba(138,90,20,0.10); }
    .tag.s-watched  { color: #345f7d; border-color: rgba(52,95,125,0.42);  background: rgba(52,95,125,0.10); }
    .tag.lindy      { color: #fff;    border-color: #c98968;               background: #c98968; }

    .item.is-hidden { display: none; }
    .lib-section.is-hidden { display: none; }

    /* ---- a little life: staggered rise-in + hover accent ---- */
    @keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .lib-section .section-label { animation: riseIn 0.5s ease both; }
    .item { animation: riseIn 0.5s cubic-bezier(0.2,0.65,0.3,1) both; }
    .list .row { transition: color 0.15s ease; }
    .item:hover .row-title { color: #b06a43; }
    .list a:hover .row-title { border-color: #c98968; }

    /* ---- Notes toggle + panel ---- */
    .item-header { display: flex; align-items: flex-start; gap: 0.5rem; }
    .item-header > a,
    .item-header > .row { flex: 1; min-width: 0; }
    .notes-btn {
      flex-shrink: 0;
      align-self: center;
      background: none;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.06rem 0.5rem;
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--mut);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .notes-btn:hover, .notes-btn.is-open { border-color: var(--ink); color: var(--ink); }
    .notes-panel {
      margin-top: 0.55rem;
      padding-left: 0.05rem;
      font-size: 0.9em;
      color: var(--mut);
      line-height: 1.65;
    }
    .notes-panel[hidden] { display: none; }
    .notes-text { margin-bottom: 0.4rem; white-space: pre-line; }
    .notes-link {
      display: inline-block;
      color: var(--mut);
      font-size: 0.85em;
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-underline-offset: 2px;
    }
    .notes-link:hover { color: var(--ink); text-decoration-color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .chip { transition: none; }
      .item, .lib-section .section-label { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="home-link" href="/">Henry Pan</a>
    <h1 class="title">Library</h1>

    <div class="lib-controls">
      <div class="filters" id="filters" role="group" aria-label="Filter library">
        <button type="button" class="chip is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip chip-lindy" data-filter="lindy" aria-pressed="false">★ Lindy</button>
        <button type="button" class="chip" data-filter="reading" aria-pressed="false">Reading</button>
        <button type="button" class="chip" data-filter="to-read" aria-pressed="false">To read</button>
        <button type="button" class="chip" data-filter="read" aria-pressed="false">Read</button>
        <button type="button" class="chip" data-filter="to-watch" aria-pressed="false">To watch</button>
        <button type="button" class="chip" data-filter="watched" aria-pressed="false">Watched</button>
      </div>
      <label class="sort">Sort
        <select id="sort" aria-label="Sort library">
          <option value="default">Default</option>
          <option value="lindy">Lindy first</option>
          <option value="status">By status</option>
          <option value="az">A–Z</option>
        </select>
      </label>
    </div>

    <div id="library"></div>
  </main>

  <script>
    // medium key -> section label (fixed order)
    var MEDIA = [
      ['Book', 'Books'],
      ['Movie', 'Movies'],
      ['TV show', 'TV shows'],
      ['Podcast', 'Podcasts'],
      ['Essay', 'Essays']
    ];
    // status display -> { key, cls } for the colored chip + filtering
    var STATUS = {
      'Reading':  { key: 'reading',  cls: 's-reading' },
      'To read':  { key: 'to-read',  cls: 's-to-read' },
      'Read':     { key: 'read',     cls: 's-read' },
      'To watch': { key: 'to-watch', cls: 's-to-watch' },
      'Watched':  { key: 'watched',  cls: 's-watched' }
    };

    function makeRow(item) {
      var linked = item.url && item.url.trim();
      var row = document.createElement(linked ? 'a' : 'span');
      if (linked) {
        row.href = item.url;
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
      } else {
        row.className = 'row';
      }
      var title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = item.title;
      row.appendChild(title);

      if (item.author) {
        var meta = document.createElement('span');
        meta.className = 'row-meta';
        meta.textContent = item.author;
        row.appendChild(meta);
      }
      var st = STATUS[item.status];
      if (st) {
        var chip = document.createElement('span');
        chip.className = 'tag ' + st.cls;
        chip.textContent = item.status;
        row.appendChild(chip);
      }
      if (item.lindy) {
        var lindy = document.createElement('span');
        lindy.className = 'tag lindy';
        lindy.textContent = '★ Lindy';
        row.appendChild(lindy);
      }
      return row;
    }

    function render(items) {
      var root = document.getElementById('library');
      MEDIA.forEach(function (m) {
        var key = m[0], label = m[1];
        var group = items.filter(function (it) { return it.medium === key; });
        if (!group.length) return;
        var section = document.createElement('section');
        section.className = 'section lib-section';
        section.dataset.medium = key;
        var head = document.createElement('p');
        head.className = 'section-label';
        head.textContent = label + ' ';
        var count = document.createElement('span');
        count.className = 'count';
        count.setAttribute('aria-hidden', 'true');
        head.appendChild(count);
        section.appendChild(head);
        var ul = document.createElement('ul');
        ul.className = 'list';
        group.forEach(function (it, i) {
          var li = document.createElement('li');
          li.className = 'item';
          li.dataset.status = (STATUS[it.status] && STATUS[it.status].key) || '';
          li.dataset.lindy = it.lindy ? 'true' : 'false';
          li.dataset.title = it.title;
          li.dataset.order = i;

          var hasNotes = (it.notes && it.notes.trim()) || (it.notes_url && it.notes_url.trim());
          if (hasNotes) {
            var header = document.createElement('div');
            header.className = 'item-header';
            header.appendChild(makeRow(it));

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'notes-btn';
            btn.textContent = 'notes';
            btn.setAttribute('aria-expanded', 'false');
            header.appendChild(btn);
            li.appendChild(header);

            var panel = document.createElement('div');
            panel.className = 'notes-panel';
            panel.hidden = true;
            if (it.notes && it.notes.trim()) {
              var p = document.createElement('p');
              p.className = 'notes-text';
              p.textContent = it.notes;
              panel.appendChild(p);
            }
            if (it.notes_url && it.notes_url.trim()) {
              var lnk = document.createElement('a');
              lnk.className = 'notes-link';
              lnk.href = it.notes_url;
              lnk.target = '_blank';
              lnk.rel = 'noopener noreferrer';
              lnk.textContent = 'Read full review →';
              panel.appendChild(lnk);
            }
            li.appendChild(panel);

            btn.addEventListener('click', function () {
              var open = !panel.hidden;
              panel.hidden = open;
              btn.setAttribute('aria-expanded', String(!open));
              btn.classList.toggle('is-open', !open);
            });
          } else {
            li.appendChild(makeRow(it));
          }

          ul.appendChild(li);
        });
        section.appendChild(ul);
        root.appendChild(section);
      });
    }

    function wireControls() {
      var sections = Array.prototype.slice.call(document.querySelectorAll('.lib-section'));
      // stagger the rise-in across all items
      Array.prototype.slice.call(document.querySelectorAll('.item')).forEach(function (li, i) {
        li.style.animationDelay = Math.min(i * 35, 560) + 'ms';
      });

      var chips = Array.prototype.slice.call(document.querySelectorAll('#filters .chip'));
      var sortSel = document.getElementById('sort');
      var current = 'all';

      function matches(li) {
        if (current === 'all') return true;
        if (current === 'lindy') return li.dataset.lindy === 'true';
        return li.dataset.status === current;
      }
      function applyFilter() {
        sections.forEach(function (sec) {
          var items = Array.prototype.slice.call(sec.querySelectorAll('.item'));
          var visible = 0;
          items.forEach(function (li) {
            var show = matches(li);
            li.classList.toggle('is-hidden', !show);
            if (show) visible++;
          });
          var countEl = sec.querySelector('.count');
          if (countEl) countEl.textContent = visible ? '(' + visible + ')' : '';
          sec.classList.toggle('is-hidden', visible === 0);
        });
      }

      var statusRank = { 'reading': 0, 'to-read': 1, 'read': 2, 'to-watch': 3, 'watched': 4 };
      function rank(li) { var r = statusRank[li.dataset.status]; return r === undefined ? 99 : r; }
      function applySort(mode) {
        sections.forEach(function (sec) {
          var ul = sec.querySelector('.list');
          var items = Array.prototype.slice.call(sec.querySelectorAll('.item'));
          items.sort(function (a, b) {
            if (mode === 'az') return a.dataset.title.localeCompare(b.dataset.title);
            if (mode === 'lindy') {
              var la = a.dataset.lindy === 'true' ? 0 : 1, lb = b.dataset.lindy === 'true' ? 0 : 1;
              if (la !== lb) return la - lb;
              return (+a.dataset.order) - (+b.dataset.order);
            }
            if (mode === 'status') {
              var ra = rank(a), rb = rank(b);
              if (ra !== rb) return ra - rb;
              return (+a.dataset.order) - (+b.dataset.order);
            }
            return (+a.dataset.order) - (+b.dataset.order);
          });
          items.forEach(function (li) { ul.appendChild(li); });
        });
      }

      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          current = chip.dataset.filter;
          chips.forEach(function (c) {
            var on = c === chip;
            c.classList.toggle('is-active', on);
            c.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          applyFilter();
        });
      });
      sortSel.addEventListener('change', function () { applySort(sortSel.value); });
      applyFilter();
    }

    fetch('/assets/data/library.json').then(function (r) { return r.json(); }).then(function (items) {
      render(items);
      wireControls();
    }).catch(function () {});
  </script>
</body>
</html>
