# Pages CMS config — https://pagescms.org
# In-browser editing for Quotes / Ideas / Library.
# Each file is a top-level JSON array (list: true); the /quotes, /ideas and
# /library pages fetch these same files and render them. Saving in the CMS
# commits to this repo, GitHub Pages redeploys, and the change goes live.

content:
  - name: quotes
    label: Quotes
    type: file
    path: assets/data/quotes.json
    format: json
    list: true
    fields:
      - name: text
        label: Quote
        type: text
      - name: author
        label: Author
        type: string

  - name: library
    label: Library
    type: file
    path: assets/data/library.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
      - name: author
        label: Author / creator
        type: string
      - name: medium
        label: Category
        type: select
        options:
          values: [Book, Movie, TV show, Podcast, Essay]
      - name: status
        label: Read tag (optional)
        type: select
        options:
          values: [Reading, To read, Read, To watch, Watched]
      - name: lindy
        label: Lindy — all-time favorite
        type: boolean
      - name: url
        label: Link (optional, for online essays)
        type: string
      - name: notes
        label: Notes / commentary (optional)
        type: text
      - name: notes_url
        label: Full review link (optional)
        type: string

  - name: ideas
    label: Ideas
    type: file
    path: assets/data/ideas.json
    format: json
    list: true
    fields:
      - name: title
        label: Title (the hook)
        type: string
      - name: body
        label: Body
        type: text
      - name: tag
        label: Tag
        type: string
