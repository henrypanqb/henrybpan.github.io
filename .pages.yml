# Pages CMS config — https://pagescms.org
# In-browser editing for Quotes / Thoughts / Devotionals.
# Each file is a top-level JSON array (list: true); the /quotes, /thoughts and
# /devotionals pages fetch these same files and render them. Saving in the CMS
# commits to this repo, GitHub Pages redeploys, and the change goes live.

content:
  - name: quotes
    label: Quotes
    type: file
    path: assets/data/quotes.json
    format: json
    list: true
    fields:
      - name: text
        label: Quote
        type: text
      - name: author
        label: Author
        type: string

  - name: thoughts
    label: Thoughts
    type: file
    path: assets/data/thoughts.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
      - name: body
        label: Thought
        type: text

  - name: devotionals
    label: Devotionals
    type: file
    path: assets/data/devotionals.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
      - name: title
        label: Title (optional)
        type: string
      - name: passage
        label: Bible passage (e.g. John 3:16)
        type: string
      - name: version
        label: Bible version
        type: string
        default: ESV
      - name: body
        label: Devotional
        type: text

  - name: library
    label: Library
    type: file
    path: assets/data/library.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
      - name: author
        label: Author / creator
        type: string
      - name: medium
        label: Category
        type: select
        options:
          values: [Book, Movie, TV show, Podcast, Essay]
      - name: status
        label: Read tag (optional)
        type: select
        options:
          values: [Reading, To read, Read, To watch, Watched]
      - name: lindy
        label: Lindy — all-time favorite
        type: boolean
      - name: url
        label: Link (optional, for online essays)
        type: string
